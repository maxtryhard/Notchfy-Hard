# Quando o build quebra na main, abre (ou atualiza) uma issue "ci-falhou";
# quando volta a passar, fecha a issue. Assim nenhum erro de CI fica esquecido.
name: issue do CI

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

permissions:
  issues: write

jobs:
  issue:
    # Só builds de push na main deste repositório: num repo público, um PR de
    # fork com uma branch chamada "main" também casaria com o filtro acima.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Abrir, atualizar ou fechar a issue
        run: |
          gh label create ci-falhou --color B60205 --description "Build quebrado na main" --force
          open=$(gh issue list --label ci-falhou --state open --json number --jq '.[0].number // empty')
          if [ "$CONCLUSION" = failure ]; then
            body="O build falhou no commit $SHA: $RUN_URL"
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh issue create --title "Build quebrado na main" --label ci-falhou --body "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Voltou a passar no commit $SHA: $RUN_URL"
          fi
