[package]
name = "notchfy"
version = "0.1.1"
description = "Barra interativa no topo da tela (notch) para macOS, Windows e Linux"
edition = "2021"
rust-version = "1.82"

[lib]
name = "notchfy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-drag = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "1"
base64 = "0.22"
dirs = "6"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2"
# Já vem pelo mpris e pelo tao; usado direto para escutar as notificações.
dbus = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "UI_Notifications",
    "UI_Notifications_Management",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
